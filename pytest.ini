[pytest]
base_url = https://www.saucedemo.com
testpaths = tests
addopts =
    -ra
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --screenshot=only-on-failure
    --output=reports/artifacts
markers =
    smoke: quick checks that the critical path works
    login: login page tests
    inventory: product listing tests
    checkout: cart and checkout tests
    known_bug: test documents a defect listed in docs/BUG_LOG.md (expected to fail)
